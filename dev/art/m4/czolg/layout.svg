 <pattern id="floor" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#b0b4a0"/><path d="M2 6L7 1M12 17L17 12" stroke="#d0d0b9" stroke-width="2"/></pattern>
 <pattern id="grille" width="15" height="20" patternUnits="userSpaceOnUse"><rect width="15" height="20" fill="#34392e"/><path d="M0 6H15M0 14H15" stroke="#7b7c5f" stroke-width="5"/></pattern>
 <g id="seat" stroke="#3a4032" stroke-width="4"><rect x="-48" y="-34" width="96" height="86" rx="8" fill="#586044"/><rect x="-48" y="-56" width="96" height="24" rx="5" fill="#7b8260"/></g>
</defs>
<g stroke="#5f624b" stroke-width="5" stroke-linejoin="round">
