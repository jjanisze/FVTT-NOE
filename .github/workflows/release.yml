name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="$(node -p "require('./module.json').version")"
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match module.json version $MODULE_VERSION"
            exit 1
          fi
          echo "Releasing v$MODULE_VERSION"

      # Runtime files only — see RELEASING.md "What's excluded from module.zip" for why.
      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json README.md LICENSE CREDITS.md \
            scripts styles templates lang icons sounds tokens ui packs docs \
            -x "*.log" -x "**/LOCK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          make_latest: "true"
          generate_release_notes: true
