name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="$(node -p "require('./module.json').version")"
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match module.json version $MODULE_VERSION"
            exit 1
          fi
          echo "Releasing v$MODULE_VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The release gate's CI subset (RELEASING.md): static checks, generator dry-runs from the
      # committed JSON, validate-packs, and dev/release/build-zip.mjs — THE include list, the same
      # script the local gate uses (the list used to live here, which is how `*.log` and `vfx/`
      # went wrong). It builds dist/module.zip from the tag and verifies it: exact file set,
      # module.json references, every pack opening from the zip with packs/' record count.
      # classic-level is Foundry's LevelDB binding; locally it comes from the Foundry install.
      - name: Release gate (CI subset) and module.zip
        run: |
          npm install --no-save --no-package-lock classic-level@3
          node dev/release/release-check.mjs --ci
          cp dist/module.zip module.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          make_latest: "true"
          generate_release_notes: true
